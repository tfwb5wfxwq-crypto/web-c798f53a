<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#F5F4F1">
<title>Muscu · Ma semaine</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F5F4F1; --s1:#FFFFFF; --s2:#FBFAF8; --s3:#ECEAE5;
  --hair:rgba(20,18,15,.08); --hair2:rgba(20,18,15,.14);
  --t1:#16140F; --t2:#5B564E; --t3:#837D74;
  --gant:#D43A2D; --gant-ink:#C2321F; --ok:#2E8F4B; --warn:#B87800; --ko:#D43A2D;
  --A:#D43A2D; --B:#2F6BD0; --C:#7A52CC;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
body{font-family:'Barlow',system-ui,sans-serif;background:var(--bg);color:var(--t1);font-size:16px;line-height:1.4;-webkit-font-smoothing:antialiased;min-height:100dvh;-webkit-user-select:none;user-select:none}
::selection{background:rgba(212,58,45,.2)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:2px solid var(--gant-ink);outline-offset:2px;border-radius:8px}
.num{font-variant-numeric:tabular-nums}
svg.ic{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round;flex:none}
.wrap{max-width:560px;margin:0 auto;padding:calc(env(safe-area-inset-top,0px) + 16px) 16px calc(env(safe-area-inset-bottom,0px) + 40px)}

/* En-tête : la semaine en un coup d'œil */
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:16px}
.top h1{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:38px;line-height:1}
.top p{color:var(--t2);font-size:15px;margin-top:4px}
.streak{display:flex;align-items:center;gap:6px;height:40px;padding:0 12px;border-radius:12px;background:var(--s1);border:1px solid var(--hair);font-weight:600;font-size:15px}
.streak svg{color:var(--warn)}

.jauge{background:var(--s1);border:1px solid var(--hair);border-radius:16px;padding:14px 16px;margin-bottom:16px}
.jauge .l1{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px}
.jauge strong{font-family:'Barlow Condensed',sans-serif;font-size:22px;font-weight:700;white-space:nowrap}
.jauge .l1{gap:12px}
.jauge small{color:var(--t2);font-size:14px;text-align:right}
.barres{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.barres span{height:8px;border-radius:4px;background:var(--s3)}
.barres span.fait{background:var(--ok)}
.barres span.cale{background:repeating-linear-gradient(90deg,var(--s3) 0 6px,rgba(20,18,15,.14) 6px 12px)}

/* Jours */
.jours{display:flex;flex-direction:column;gap:8px}
.jour{display:grid;grid-template-columns:52px 1fr;gap:12px;padding:12px;border-radius:16px;background:var(--s1);border:1px solid var(--hair);min-height:72px;transition:border-color .15s,background-color .15s}
.jour.passe{opacity:.55}
.jour.auj{border-color:rgba(212,58,45,.35);box-shadow:0 2px 10px rgba(20,18,15,.05)}
.jour.cible-ok{border-color:var(--ok);background:#EEF7F0}
.jour.cible-ko{border-color:var(--ko);background:#FCEDEB}
.date{display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding-top:2px}
.date b{font-family:'Barlow Condensed',sans-serif;font-size:13px;font-weight:600;letter-spacing:.04em;color:var(--t3)}
.date strong{font-family:'Barlow Condensed',sans-serif;font-size:26px;font-weight:700;line-height:1.05}
.jour.auj .date b{color:var(--gant-ink)}
.contenu{display:flex;flex-direction:column;gap:6px;min-width:0}
.ligne{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--t2);min-width:0}
.ligne .h{color:var(--t3);font-variant-numeric:tabular-nums;width:40px;flex:none}
.ligne .t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ligne.boxe .t{color:var(--t1);font-weight:500}
.ligne.boxe i{width:8px;height:8px;border-radius:2px;background:var(--t2);flex:none}
.libre{font-size:14px;color:var(--t3)}

/* Séance : la pastille qu'on glisse */
.seance{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;background:var(--s2);border:1px solid var(--hair2);touch-action:none;cursor:grab;position:relative;-webkit-touch-callout:none;-webkit-user-select:none}
.seance::before{content:"";width:4px;align-self:stretch;border-radius:2px;background:var(--c)}
.seance .nom{font-weight:600;line-height:1.2}
.seance .sous{font-size:13px;color:var(--t2)}
.seance .txt{flex:1;min-width:0}
.seance .grip{color:var(--t3)}
.seance.faite{cursor:default;background:var(--bg)}
.seance.faite .nom{color:var(--t2)}
.seance.faite .grip{color:var(--ok)}
.seance.fantome{position:fixed;z-index:50;pointer-events:none;background:#fff;box-shadow:0 14px 32px rgba(20,18,15,.18);transform:rotate(-1.5deg) scale(1.03)}
.seance.origine{opacity:.25}

.aide{color:var(--t3);font-size:13px;text-align:center;margin-top:16px}

/* Message de l'agent */
.toast{position:fixed;left:12px;right:12px;bottom:calc(env(safe-area-inset-bottom,0px) + 12px);max-width:536px;margin:0 auto;z-index:60;background:var(--s1);border:1px solid var(--hair2);border-radius:16px;padding:14px 16px;display:flex;gap:12px;align-items:flex-start;box-shadow:0 12px 28px rgba(20,18,15,.14);transform:translateY(calc(100% + 24px));visibility:hidden;transition:transform .3s cubic-bezier(.22,1,.36,1),visibility 0s .3s}
.toast.show{transform:none;visibility:visible;transition:transform .3s cubic-bezier(.22,1,.36,1)}
.toast .ic{margin-top:2px}
.toast.ok .ic{color:var(--ok)}
.toast.ko .ic{color:var(--ko)}
.toast strong{display:block;font-weight:600}
.toast small{color:var(--t2);font-size:14px}
.voile{position:fixed;inset:0;background:rgba(20,18,15,.28);z-index:70;opacity:0;visibility:hidden;transition:opacity .2s,visibility 0s .2s}
.voile.show{opacity:1;visibility:visible;transition:opacity .2s}
.panneau{position:fixed;left:0;right:0;bottom:0;z-index:80;background:var(--s1);border-radius:22px 22px 0 0;padding:12px 16px calc(env(safe-area-inset-bottom,0px) + 16px);max-width:560px;margin:0 auto;transform:translateY(105%);transition:transform .3s cubic-bezier(.22,1,.36,1);box-shadow:0 -8px 30px rgba(20,18,15,.12)}
.panneau.show{transform:none}
.poignee{width:40px;height:5px;border-radius:3px;background:var(--s3);margin:0 auto 14px}
.panneau h2{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:26px;line-height:1.1}
.panneau .sous{color:var(--t2);font-size:14px;margin:2px 0 16px}
.panneau h3{font-size:14px;font-weight:600;color:var(--t2);margin:0 0 8px}
.choix{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:18px}
.choix button{height:56px;border-radius:12px;border:1px solid var(--hair2);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;font-variant-numeric:tabular-nums}
.choix button b{font-family:'Barlow Condensed',sans-serif;font-size:12px;font-weight:600;color:var(--t3);letter-spacing:.04em}
.choix button span{font-weight:600;font-size:17px}
.choix button.ko{background:var(--bg);color:var(--t3);border-color:transparent}
.choix button.ko span{text-decoration:line-through;text-decoration-color:var(--ko);text-decoration-thickness:2px}
.choix button.sel{background:var(--t1);border-color:var(--t1);color:#fff}
.choix button.sel b{color:rgba(255,255,255,.7)}
.heures{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.heures button{height:44px;padding:0 14px;border-radius:12px;border:1px solid var(--hair2);font-weight:600;font-variant-numeric:tabular-nums}
.heures button.sel{background:var(--t1);border-color:var(--t1);color:#fff}
.heures input{height:44px;border-radius:12px;border:1px solid var(--hair2);padding:0 10px;font:inherit;font-weight:600;background:var(--s1);color:var(--t1)}
.avis{font-size:14px;padding:10px 12px;border-radius:12px;margin-bottom:14px;background:#EEF7F0;color:#1F5E33}
.avis.ko{background:#FCEDEB;color:#8E2219}
.go{width:100%;height:52px;border-radius:14px;background:var(--t1);color:#fff;font-weight:600;font-size:16px}
.go:disabled{background:var(--s3);color:var(--t3)}
</style>
</head>
<body>
<main class="wrap">
  <header class="top">
    <div><h1>Ma semaine</h1><p>2 au 8 novembre</p></div>
    <span class="streak num" aria-label="3 semaines complètes d'affilée"><svg class="ic" viewBox="0 0 24 24"><path d="M12 3c1 3 4 4.5 4 8.5a4 4 0 0 1-8 0c0-1.5.6-2.6 1.4-3.4.2 1.4 1 2.2 1.9 2.4C11 8.5 10.5 6 12 3z"/></svg>3 semaines</span>
  </header>
  <section class="jauge" aria-label="Avancement de la semaine">
    <div class="l1"><strong class="num" id="jaugeTxt">1 séance sur 3</strong><small id="jaugeSous">2 à caser d'ici dimanche</small></div>
    <div class="barres" id="barres"></div>
  </section>
  <section class="jours" id="jours"></section>
  <p class="aide">Touche une séance pour changer le jour ou l’heure, ou maintiens-la et glisse-la</p>
</main>
<div class="voile" id="voile" onclick="if (Date.now() - ouvertA > 450) fermer()"></div>
<section class="panneau" id="panneau" role="dialog" aria-label="Déplacer la séance"></section>
<div class="toast" id="toast" role="status" aria-live="polite"><svg class="ic" viewBox="0 0 24 24" id="toastIc"></svg><div><strong id="toastT"></strong><small id="toastS"></small></div></div>

<script>
// Maquette : rendez-vous réels de la semaine du 2 novembre, séances d'exemple
const JOURS = ['LUN','MAR','MER','JEU','VEN','SAM','DIM'];
const NOMS = ['lundi','mardi','mercredi','jeudi','vendredi','samedi','dimanche'];
const AUJ = 3; // jeudi 5
const semaine = [
  { n:2, boxe:true,  agenda:[] },
  { n:3, boxe:true,  agenda:[] },
  { n:4, boxe:true,  agenda:[{h:'14:00',t:'Sandra (RSM)'}] },
  { n:5, boxe:false, agenda:[{h:'12:00',t:'Écrire à Dym'},{h:'16:00',t:'Squash avec Paco'}] },
  { n:6, boxe:true,  agenda:[] },
  { n:7, boxe:false, agenda:[{h:'20:00',t:'Prendre le Mac'}] },
  { n:8, boxe:false, agenda:[{h:'12:00',t:'Télé Airbnb avec Alfred'},{h:'18:00',t:'Poster la vidéo'},{h:'20:00',t:'Contrat Marble'}] },
];
const SEANCES = {
  A:{nom:'Séance A',sous:'Tirage horizontal et biceps · 40 min',c:'var(--A)'},
  B:{nom:'Séance B',sous:'Tirage vertical et arrière d’épaule · 40 min',c:'var(--B)'},
  C:{nom:'Séance C',sous:'Mix et bras · 35 min',c:'var(--C)'},
};
// où est chaque séance, à quelle heure, et si elle est faite
const place = { A:{j:1,h:'18:00',faite:true}, B:{j:3,h:'18:30',faite:false}, C:{j:5,h:'11:00',faite:false} };   // exemple

const I = {
  grip:'<svg class="ic" viewBox="0 0 24 24"><circle cx="9" cy="6" r="1"/><circle cx="15" cy="6" r="1"/><circle cx="9" cy="12" r="1"/><circle cx="15" cy="12" r="1"/><circle cx="9" cy="18" r="1"/><circle cx="15" cy="18" r="1"/></svg>',
  check:'<svg class="ic" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',
  warn:'<path d="M12 4l9 16H3z"/><path d="M12 10v4M12 17.5v.5"/>',
  ok:'<path d="M5 12.5l4.5 4.5L19 7.5"/>',
};

function render() {
  const el = document.getElementById('jours'); let h = '';
  semaine.forEach((d, i) => {
    const ici = Object.keys(place).filter(k => place[k].j === i);
    const lignes = [];
    if (d.boxe) lignes.push({h:'11:20',t:'Boxe (circuit training)',boxe:true});
    d.agenda.forEach(a => lignes.push(a));
    lignes.sort((a, b) => a.h.localeCompare(b.h));
    h += `<div class="jour${i < AUJ ? ' passe' : ''}${i === AUJ ? ' auj' : ''}" data-j="${i}">
      <div class="date"><b>${JOURS[i]}</b><strong class="num">${d.n}</strong></div><div class="contenu">`;
    lignes.forEach(l => h += `<div class="ligne${l.boxe ? ' boxe' : ''}"><span class="h">${l.h}</span>${l.boxe ? '<i></i>' : ''}<span class="t">${l.t}</span></div>`);
    ici.forEach(k => { const s = SEANCES[k], p = place[k];
      h += `<div class="seance${p.faite ? ' faite' : ''}" data-s="${k}" style="--c:${s.c}"><div class="txt"><div class="nom">${s.nom} <span class="num" style="color:var(--t2);font-weight:500">· ${p.h}</span></div><div class="sous">${p.faite ? 'Faite, 5 exercices notés' : s.sous}</div></div><span class="grip">${p.faite ? I.check : I.grip}</span></div>`; });
    if (!lignes.length && !ici.length) h += '<div class="libre">Repos</div>';
    h += '</div></div>';
  });
  el.innerHTML = h;
  const faites = Object.values(place).filter(p => p.faite).length;
  document.getElementById('jaugeTxt').textContent = faites + ' séance' + (faites > 1 ? 's' : '') + ' sur 3';
  document.getElementById('jaugeSous').textContent = (3 - faites) ? (3 - faites) + ' à faire, déjà calées' : 'Semaine complète';
  document.getElementById('barres').innerHTML = ['A','B','C'].map(k => `<span class="${place[k].faite ? 'fait' : 'cale'}"></span>`).join('');
  brancher();
}

// Règles de l'agent : pas 2 séances 2 jours de suite, pas dans le passé, pas en même temps qu'un rendez-vous
function verdict(k, j, heure) {
  if (j < AUJ) return { ok:false, t:'Ce jour est passé', s:'Choisis aujourd’hui ou un jour qui vient.' };
  if (j === 6) return { ok:false, t:'Le dimanche, c’est repos', s:'Ta règle : jamais de séance le dimanche.' };
  for (const x of Object.keys(place)) {
    if (x === k) continue;
    if (Math.abs(place[x].j - j) === 0) return { ok:false, t:'Déjà une séance ce jour-là', s:'Une seule séance par jour.' };
    if (Math.abs(place[x].j - j) === 1) return { ok:false, t:'Trop près de la séance ' + x, s:'Garde un jour de repos entre deux séances pour que le dos récupère.' };
  }
  const h = heure || place[k].h, conflit = semaine[j].agenda.find(a => Math.abs(min(a.h) - min(h)) < 60);
  if (conflit) return { ok:true, t:'Calé ' + NOMS[j], s:'Attention, ' + conflit.t.toLowerCase() + ' à ' + conflit.h + ' : je propose de la décaler à ' + plus(conflit.h, 90) + '.' , heure:plus(conflit.h, 90) };
  if (semaine[j].boxe) return { ok:true, t:'Calé ' + NOMS[j] + ' à ' + h, s:'Jour de boxe : en fin de journée, c’est bon. Hydrate-toi bien.' };
  return { ok:true, t:'Calé ' + NOMS[j] + ' à ' + h, s:'Je le mets dans ton agenda et je te le rappelle le matin.' };
}
const min = h => +h.slice(0, 2) * 60 + +h.slice(3);
const plus = (h, m) => { const t = min(h) + m; return String(Math.floor(t / 60)).padStart(2, '0') + ':' + String(t % 60).padStart(2, '0'); };

let tT;
function toast(v) {
  const t = document.getElementById('toast');
  t.className = 'toast show ' + (v.ok ? 'ok' : 'ko');
  document.getElementById('toastIc').innerHTML = v.ok ? I.ok : I.warn;
  document.getElementById('toastT').textContent = v.t; document.getElementById('toastS').textContent = v.s;
  clearTimeout(tT); tT = setTimeout(() => t.classList.remove('show'), 4200);
}

// ===== Changer le jour ou l'heure : appui court = panneau, appui long = glisser =====
let choix = null;
function creneaux(j) {   // créneaux libres de 1 h entre les rendez-vous, après la boxe du matin
  const pris = semaine[j].agenda.map(a => min(a.h)).concat(semaine[j].boxe ? [min('11:20')] : []);
  return ['07:00','12:30','14:00','17:00','18:30','20:00'].filter(h => pris.every(p => Math.abs(p - min(h)) >= 75)).slice(0, 4);
}
let ouvertA = 0;
function ouvrir(k) {
  ouvertA = Date.now();
  choix = { k, j: place[k].j, h: place[k].h };
  dessiner(); document.getElementById('voile').classList.add('show'); document.getElementById('panneau').classList.add('show');
}
function fermer() { document.getElementById('voile').classList.remove('show'); document.getElementById('panneau').classList.remove('show'); }
function dessiner() {
  const k = choix.k, s = SEANCES[k];
  const v = verdict(k, choix.j, choix.h);
  const libres = creneaux(choix.j);
  let h = `<div class="poignee"></div><h2>${s.nom}</h2><p class="sous">${s.sous}</p><h3>Le jour</h3><div class="choix">`;
  semaine.forEach((d, i) => { const ok = verdict(k, i, choix.h).ok;
    h += `<button type="button" class="${i === choix.j ? 'sel' : ''}${ok ? '' : ' ko'}" onclick="choix.j=${i};dessiner()" aria-label="${NOMS[i]} ${d.n}${ok ? '' : ', déconseillé'}"><b>${JOURS[i]}</b><span>${d.n}</span></button>`; });
  h += `</div><h3>L’heure · créneaux libres dans ton agenda</h3><div class="heures">`;
  libres.forEach(x => h += `<button type="button" class="${x === choix.h ? 'sel' : ''}" onclick="choix.h='${x}';dessiner()">${x}</button>`);
  h += `<input type="time" value="${choix.h}" aria-label="Autre heure" onchange="choix.h=this.value;dessiner()"></div>`;
  h += `<p class="avis${v.ok ? '' : ' ko'}"><strong>${v.t}.</strong> ${v.s}</p>`;
  h += `<button type="button" class="go" ${v.ok ? '' : 'disabled'} onclick="valider()">${v.ok ? 'Caler ' + NOMS[choix.j] + ' à ' + (v.heure || choix.h) : 'Choisis un autre jour'}</button>`;
  document.getElementById('panneau').innerHTML = h;
}
function valider() {
  const v = verdict(choix.k, choix.j, choix.h); if (!v.ok) return;
  place[choix.k].j = choix.j; place[choix.k].h = v.heure || choix.h;
  fermer(); render(); toast({ ok: true, t: 'Calé ' + NOMS[choix.j] + ' à ' + place[choix.k].h, s: 'Dans la vraie appli : ajouté à ton agenda, rappel le matin.' });
}

// Glisser au doigt : appui long, défilement auto près des bords, rouge si refusé
function brancher() {
  document.querySelectorAll('.seance:not(.faite)').forEach(el => {
    el.addEventListener('pointerdown', e => {
      const k = el.dataset.s, r = el.getBoundingClientRect(), dx = e.clientX - r.left, dy = e.clientY - r.top, x0 = e.clientX, y0 = e.clientY;
      let fantome = null, cible = null, pos = e, defile = null;
      try { el.setPointerCapture(e.pointerId); } catch (er) {}
      const appui = setTimeout(demarrer, 220);
      function demarrer() {
        fantome = el.cloneNode(true); fantome.classList.add('fantome'); fantome.style.width = r.width + 'px';
        document.body.appendChild(fantome); el.classList.add('origine'); bouger(pos);
        if (navigator.vibrate) navigator.vibrate(12);
        defile = setInterval(() => {   // fait défiler la page quand le doigt est près du haut ou du bas
          const y = pos.clientY, H = innerHeight;
          if (y > H - 90) scrollBy(0, 14); else if (y < 90) scrollBy(0, -14); else return;
          bouger(pos);
        }, 16);
      }
      function bouger(ev) {
        pos = ev;
        if (!fantome) { if (Math.hypot(ev.clientX - x0, ev.clientY - y0) > 10) annuler(); return; }
        fantome.style.left = (ev.clientX - dx) + 'px'; fantome.style.top = (ev.clientY - dy) + 'px';
        const sous = document.elementsFromPoint(ev.clientX, ev.clientY).find(n => n.classList && n.classList.contains('jour'));
        document.querySelectorAll('.jour').forEach(n => n.classList.remove('cible-ok', 'cible-ko'));
        cible = sous ? +sous.dataset.j : null;
        if (sous && cible !== place[k].j) sous.classList.add(verdict(k, cible).ok ? 'cible-ok' : 'cible-ko');
      }
      function annuler() { clearTimeout(appui); nettoyer(); }
      function nettoyer() { el.removeEventListener('pointermove', bouger); el.removeEventListener('pointerup', fin); el.removeEventListener('pointercancel', fin); clearInterval(defile); }
      function fin(ev) {
        clearTimeout(appui); nettoyer();
        if (!fantome) { if (ev.type === 'pointerup' && Math.hypot(ev.clientX - x0, ev.clientY - y0) < 10) ouvrir(k); return; }
        fantome.remove(); el.classList.remove('origine');
        if (cible != null && cible !== place[k].j) {
          const v = verdict(k, cible); toast(v);
          if (v.ok) { place[k].j = cible; if (v.heure) place[k].h = v.heure; }
        }
        render();
      }
      el.addEventListener('pointermove', bouger); el.addEventListener('pointerup', fin); el.addEventListener('pointercancel', fin);
    });
  });
}
render();
</script>
</body>
</html>
