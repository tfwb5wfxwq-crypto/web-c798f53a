<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#F5F4F1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Muscu">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="../icon-180.png">
<link rel="icon" type="image/png" href="../icon-180.png">
<title>Muscu · Ludo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F5F4F1; --s1:#FFFFFF; --s2:#FBFAF8; --s3:#ECEAE5;
  --hair:rgba(20,18,15,.08); --hair2:rgba(20,18,15,.14);
  --t1:#16140F; --t2:#5B564E; --t3:#837D74;
  --gant:#D43A2D; --ok:#2E8F4B; --ko:#D43A2D;
  --A:#D43A2D; --B:#2F6BD0; --C:#7A52CC;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
body{font-family:'Barlow',system-ui,sans-serif;background:var(--bg);color:var(--t1);font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased;min-height:100dvh}
::selection{background:rgba(212,58,45,.2)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input{font:inherit;color:inherit}
a{color:inherit}
:focus-visible{outline:2px solid var(--gant);outline-offset:2px;border-radius:8px}
.num{font-variant-numeric:tabular-nums}
svg.ic{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round;flex:none}
.wrap{max-width:560px;margin:0 auto;padding:calc(env(safe-area-inset-top,0px) + 16px) 16px calc(env(safe-area-inset-bottom,0px) + 96px)}
h1{font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:38px;line-height:1}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:16px}
.top p{color:var(--t2);font-size:15px;margin-top:4px}
.pill{display:flex;align-items:center;gap:6px;height:40px;padding:0 12px;border-radius:12px;background:var(--s1);border:1px solid var(--hair);font-weight:600;font-size:15px}
.pill svg{color:var(--t3)}
.card{background:var(--s1);border:1px solid var(--hair);border-radius:16px}

/* Onglets du bas */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:40;background:rgba(255,255,255,.94);-webkit-backdrop-filter:saturate(1.4) blur(14px);backdrop-filter:saturate(1.4) blur(14px);border-top:1px solid var(--hair);padding:6px 8px calc(env(safe-area-inset-bottom,0px) + 6px)}
.tabs div{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr)}
.tabs button{display:flex;flex-direction:column;align-items:center;gap:2px;height:52px;justify-content:center;font-size:12px;font-weight:600;color:var(--t3);border-radius:12px}
.tabs button.on{color:var(--t1)}
.tabs button.on svg{color:var(--gant)}

/* Semaine */
.jauge{padding:14px 16px;margin-bottom:16px}
.jauge .l1{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:10px}
.jauge strong{font-family:'Barlow Condensed',sans-serif;font-size:22px;font-weight:600;white-space:nowrap}
.jauge small{color:var(--t2);font-size:14px;text-align:right}
.barres{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.barres span{height:8px;border-radius:4px;background:var(--s3)}
.barres span.fait{background:var(--ok)}
.barres span.cale{background:repeating-linear-gradient(90deg,var(--s3) 0 6px,rgba(20,18,15,.14) 6px 12px)}
.jours{display:flex;flex-direction:column;gap:8px}
.jour{display:grid;grid-template-columns:52px 1fr;gap:12px;padding:12px;border-radius:16px;background:var(--s1);border:1px solid var(--hair);min-height:72px;transition:border-color .15s,background-color .15s}
.jour.passe{opacity:.55}
.jour.auj{border-color:rgba(212,58,45,.35);box-shadow:0 2px 10px rgba(20,18,15,.05)}
.jour.cible-ok{border-color:var(--ok);background:#EEF7F0}
.jour.cible-ko{border-color:var(--ko);background:#FCEDEB}
.date{display:flex;flex-direction:column;align-items:center;padding-top:2px}
.date b{font-family:'Barlow Condensed',sans-serif;font-size:13px;font-weight:600;color:var(--t3)}
.date strong{font-family:'Barlow Condensed',sans-serif;font-size:26px;font-weight:600;line-height:1.05}
.jour.auj .date b{color:var(--gant)}
.contenu{display:flex;flex-direction:column;gap:6px;min-width:0}
.ligne{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--t2);min-width:0}
.ligne .h{color:var(--t3);width:40px;flex:none}
.ligne .t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ligne.boxe .t{color:var(--t1);font-weight:500}
.ligne.boxe i{width:8px;height:8px;border-radius:2px;background:var(--t2);flex:none}
.libre{font-size:14px;color:var(--t3)}
.seance{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;background:var(--s2);border:1px solid var(--hair2);touch-action:none;cursor:grab;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
.seance::before{content:"";width:4px;align-self:stretch;border-radius:2px;background:var(--c)}
.seance .nom{font-weight:600;line-height:1.2}
.seance .nom span{color:var(--t2);font-weight:500}
.seance .sous{font-size:13px;color:var(--t2)}
.seance .txt{flex:1;min-width:0}
.seance .grip{color:var(--t3)}
.seance.faite{cursor:default;background:var(--bg)}
.seance.faite .nom{color:var(--t2)}
.seance.faite .grip{color:var(--ok)}
.seance.fantome{position:fixed;z-index:50;pointer-events:none;background:#fff;box-shadow:0 14px 32px rgba(20,18,15,.18);transform:rotate(-1.5deg) scale(1.03)}
.seance.origine{opacity:.25}
.aide{color:var(--t3);font-size:13px;text-align:center;margin-top:16px}

/* Séance */
.sess{padding:18px 16px 8px}
.sess h2{font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:30px;line-height:1.05;display:flex;align-items:center;gap:10px}
.sess h2 i{width:12px;height:12px;border-radius:3px;background:var(--c);flex:none}
.sess p{color:var(--t2);font-size:15px;margin-top:4px}
.choixS{display:flex;gap:8px;margin-bottom:12px}
.choixS button{flex:1;height:56px;border-radius:12px;border:1px solid var(--hair2);background:var(--s1);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;color:var(--t3)}
.choixS button b{font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:22px;line-height:1}
.choixS button small{font-size:12px;font-weight:500}
.choixS button.jour{color:var(--t1);border-color:var(--t1)}
.choixS button.jour small{font-weight:600}
.choixS button.on{background:var(--t1);border-color:var(--t1);color:#fff}
.choixS button.faite:not(.on){opacity:.6}
.retour-jour{display:block;width:100%;margin:-4px 0 12px;padding:10px;border-radius:10px;background:var(--s2);font-weight:600;font-size:14px;color:var(--t1)}
.ex{display:flex;align-items:center;gap:14px;padding:12px 16px;width:100%;text-align:left;border-top:1px solid var(--hair)}
.ex:active{background:var(--s2)}
.ex .thumb{width:64px;height:48px;border-radius:8px;object-fit:cover;background:var(--s3);flex:none}
.ex .txt{flex:1;min-width:0}
.ex .txt strong{display:block;font-weight:600;line-height:1.25}
.ex .txt small{color:var(--t2);font-size:14px}
.ex .state{color:var(--t3)}
.ex.done .state{color:var(--ok)}
.ex.done .txt strong{color:var(--t2)}
.fin{padding:12px 16px 16px;border-top:1px solid var(--hair)}

/* Fiche exercice = le cours */
.sheet{position:fixed;inset:0;background:var(--bg);z-index:60;overflow-y:auto;transform:translateY(100%);transition:transform .32s cubic-bezier(.22,1,.36,1);visibility:hidden}
.sheet.open{transform:none;visibility:visible}
.sheet .wrap{padding-top:calc(env(safe-area-inset-top,0px) + 12px);padding-bottom:calc(env(safe-area-inset-bottom,0px) + 110px)}
.iconbtn{width:44px;height:44px;display:grid;place-items:center;border-radius:12px;color:var(--t2);background:var(--s1);border:1px solid var(--hair)}
.anim{position:relative;aspect-ratio:3/2;border-radius:16px;overflow:hidden;background:#fff;margin:12px 0 16px;border:1px solid var(--hair)}
.anim img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.anim img+img{animation:flip 2.6s ease-in-out infinite}
.anim .lab{position:absolute;left:10px;bottom:10px;background:rgba(255,255,255,.92);border-radius:8px;padding:4px 8px;font-size:12px;font-weight:600;color:var(--t2)}
.encours{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 16px;border-top:1px solid var(--hair);background:var(--s2)}
.encours .chrono{font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:30px;line-height:1;font-variant-numeric:tabular-nums}
.encours small{display:block;color:var(--t2);font-size:13px;margin-top:2px}
.encours .stop{height:40px;padding:0 14px;border-radius:10px;border:1px solid var(--hair2);background:var(--s1);font-weight:600;font-size:14px}
.ex.suivant{background:var(--s2);box-shadow:inset 3px 0 0 var(--c)}
.ex .tag{display:inline-block;margin-left:6px;font-size:12px;font-weight:600;color:var(--t1);background:var(--s3);border-radius:6px;padding:1px 6px;vertical-align:1px}
.ex.saute .txt strong{color:var(--t3);text-decoration:line-through}
.depart{padding:12px 16px 16px;border-top:1px solid var(--hair)}
.depart p{color:var(--t2);font-size:14px;margin-top:8px;text-align:center}
.bilan h2{font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:34px;line-height:1.05;margin:8px 0 4px}
.bilan .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:16px 0}
.bilan .stat{background:var(--s1);border:1px solid var(--hair);border-radius:12px;padding:12px}
.bilan .stat b{display:block;font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:26px;line-height:1.1;font-variant-numeric:tabular-nums}
.bilan .stat span{color:var(--t2);font-size:13px}
.bilan .ligne{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-top:1px solid var(--hair);font-size:15px}
.bilan .ligne:first-child{border-top:0}
.bilan .ligne b{font-variant-numeric:tabular-nums;white-space:nowrap}
.bilan .ligne .up{color:var(--ok)}
.sheet .chrono-mini{float:right;margin-top:10px;font-weight:600;font-variant-numeric:tabular-nums;color:var(--t2)}
.g-haut{display:grid;grid-template-columns:44px 1fr 44px;align-items:center;gap:8px}
.g-haut span{text-align:center;color:var(--t2);font-size:15px;font-weight:600}
.g-haut b{text-align:right;font-weight:600;color:var(--t2)}
.g-serie{margin:4px 0 6px;font-family:'Barlow Condensed',sans-serif}
.g-serie b{font-size:44px;font-weight:600;line-height:1}
.g-serie span{font-size:22px;color:var(--t2)}
.g-faites{color:var(--t2);font-size:15px;margin-bottom:12px}
.g-champs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.g-ok{width:100%;height:60px;font-size:19px}
.g-apres{text-align:center;color:var(--t3);font-size:14px;margin:10px 0 16px}
.g-cours{border:1px solid var(--hair);border-radius:12px;background:var(--s1);padding:0 12px;margin-bottom:8px}
.g-cours summary{padding:12px 0;font-weight:600;cursor:pointer}
.g-cours ol,.g-cours ul{list-style:none;padding:0 0 12px;display:grid;gap:8px;font-size:15px}
.g-cours li{display:flex;gap:8px}
.r-centre{text-align:center;padding:40px 0 28px}
.r-temps{font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:96px;line-height:1}
.r-temps.ding{color:var(--ok)}
.r-etat{color:var(--t2);margin-top:8px}
.r-plus{display:flex;gap:8px;justify-content:center;margin-top:16px}
.r-plus button{height:40px;padding:0 16px;border-radius:10px;border:1px solid var(--hair2);background:var(--s1);font-weight:600;font-size:15px}
.r-next{margin-bottom:16px}
.r-next p{color:var(--t3);font-size:14px;margin-bottom:8px}
.r-carte{display:flex;gap:12px;align-items:center;padding:12px;border:1px solid var(--hair);border-radius:12px;background:var(--s1)}
.r-carte img{width:64px;height:64px;border-radius:8px;object-fit:cover;background:var(--s3)}
.r-carte strong{display:block;font-weight:600}
.r-carte small{color:var(--t2);font-size:14px}
.r-moy{color:var(--t3);font-size:13px;font-weight:500}
.lien-annuler{display:block;margin:12px auto 4px;background:none;border:0;color:var(--t3);font:inherit;font-size:14px;text-decoration:underline;text-underline-offset:3px;padding:8px}
.anim.photos{aspect-ratio:4/5;background:#F7F6F3}
.anim.vid{aspect-ratio:auto;height:min(72vh,calc(100vw * 16 / 9));margin:4px -16px 16px;border:0;border-radius:0;background:transparent}
.anim.vid video{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;mix-blend-mode:multiply}
.anim.photos img{object-fit:contain;opacity:0;animation:none}
.anim.photos img.on{opacity:1}
.anim .pas{position:absolute;right:10px;bottom:10px;display:flex;gap:4px}
.anim .pas i{width:6px;height:6px;border-radius:3px;background:rgba(20,18,15,.18)}
.anim .pas i.on{background:var(--t1)}
@keyframes flip{0%,38%{opacity:0}50%,88%{opacity:1}100%{opacity:0}}
@media (prefers-reduced-motion:reduce){.anim img+img{animation:none;opacity:0}}
.ex-title{font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:34px;line-height:1.05}
.ex-meta{color:var(--t2);margin:6px 0 14px}
.bloc{padding:14px 16px;margin-bottom:10px}
.bloc h3{font-size:14px;font-weight:600;color:var(--t2);margin-bottom:8px}
.bloc ol,.bloc ul{list-style:none;display:flex;flex-direction:column;gap:8px}
.bloc li{display:flex;gap:10px;font-size:15px}
.bloc ol li b{width:22px;height:22px;border-radius:50%;background:var(--t1);color:#fff;font-size:12px;display:grid;place-items:center;flex:none;margin-top:1px}
.bloc ul li svg{color:var(--ko);margin-top:1px;width:18px;height:18px}
.liens{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:16px}
.lien{display:flex;align-items:center;justify-content:center;gap:8px;height:48px;border-radius:12px;border:1px solid var(--hair2);background:var(--s1);font-weight:600;font-size:15px;text-decoration:none}
.conseil{font-size:14px;color:var(--t2);background:var(--s1);border:1px solid var(--hair);border-radius:12px;padding:10px 12px;margin-bottom:12px}
.conseil b{color:var(--t1)}
.conseil .up{color:var(--ok);font-weight:600}
.sets{display:flex;flex-direction:column;gap:8px;margin-bottom:14px}
.set{display:grid;grid-template-columns:28px 1fr 1fr 48px;gap:8px;align-items:center}
.set .n{font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:18px;color:var(--t3);text-align:center}
.field{position:relative}
.field input{width:100%;height:48px;border-radius:10px;background:var(--s1);border:1px solid var(--hair2);padding:0 40px 0 14px;font-size:18px;font-weight:600;font-variant-numeric:tabular-nums;-moz-appearance:textfield;caret-color:var(--gant)}
.field input::-webkit-outer-spin-button,.field input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.field input:focus{border-color:var(--t2);outline:none}
.r-apercu{margin-top:14px}.r-apercu .anim{margin:8px 0 8px}.r-apercu .anim.vid{height:42vh}.r-prep{font-size:14px;color:var(--t3,#888);margin:0 0 4px}
.nav-sem{display:flex;justify-content:space-between;padding:8px 16px 0}.nav-sem button{border:0;background:none;font:inherit;font-size:15px;font-weight:500;color:var(--t2,#555);padding:8px 0}
.g-elas{display:block;margin:10px auto 0;padding:10px 18px;border-radius:999px;border:1px solid var(--line,rgba(0,0,0,.12));background:transparent;font:inherit;font-size:15px;color:var(--t2,#555)}
.g-elas.on{background:var(--t1,#111);color:#fff;border-color:transparent}
.field input::placeholder{color:var(--t3);font-weight:500}
.field em{position:absolute;right:12px;top:50%;transform:translateY(-50%);font-style:normal;color:var(--t3);font-size:14px;pointer-events:none}
.check{width:48px;height:48px;border-radius:12px;border:1.5px solid var(--hair2);display:grid;place-items:center;color:transparent;background:var(--s1);transition:background-color .2s,border-color .2s,color .2s}
.check.on{background:var(--ok);border-color:var(--ok);color:#fff}
.set.on .field input{color:var(--t2)}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;height:52px;border-radius:14px;font-weight:600;font-size:16px}
.btn-main{background:var(--t1);color:#fff}
.btn-ghost{background:var(--s1);border:1px solid var(--hair2)}
.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}

/* Panneau jour + heure */
.voile{position:fixed;inset:0;background:rgba(20,18,15,.28);z-index:70;opacity:0;visibility:hidden;transition:opacity .2s,visibility 0s .2s}
.voile.show{opacity:1;visibility:visible;transition:opacity .2s}
.panneau{position:fixed;left:0;right:0;bottom:0;z-index:80;background:var(--s1);border-radius:22px 22px 0 0;padding:12px 16px calc(env(safe-area-inset-bottom,0px) + 16px);max-width:560px;margin:0 auto;transform:translateY(105%);transition:transform .3s cubic-bezier(.22,1,.36,1);box-shadow:0 -8px 30px rgba(20,18,15,.12)}
.panneau.show{transform:none}
.poignee{width:40px;height:5px;border-radius:3px;background:var(--s3);margin:0 auto 14px}
.panneau h2{font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:26px;line-height:1.1}
.panneau .sous{color:var(--t2);font-size:14px;margin:2px 0 16px}
.panneau h3{font-size:14px;font-weight:600;color:var(--t2);margin:0 0 8px}
.choix{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:18px}
.choix button{height:56px;border-radius:12px;border:1px solid var(--hair2);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px}
.choix button b{font-family:'Barlow Condensed',sans-serif;font-size:12px;font-weight:600;color:var(--t3)}
.choix button span{font-weight:600;font-size:17px;font-variant-numeric:tabular-nums}
.choix button.ko{background:var(--bg);color:var(--t3);border-color:transparent}
.choix button.ko span{text-decoration:line-through;text-decoration-color:var(--ko);text-decoration-thickness:2px}
.choix button.sel{background:var(--t1);border-color:var(--t1);color:#fff}
.choix button.sel b{color:rgba(255,255,255,.7)}
.heures{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.heures button{height:44px;padding:0 14px;border-radius:12px;border:1px solid var(--hair2);font-weight:600;font-variant-numeric:tabular-nums}
.heures button.sel{background:var(--t1);border-color:var(--t1);color:#fff}
.heures input{height:44px;border-radius:12px;border:1px solid var(--hair2);padding:0 10px;font-weight:600;background:var(--s1)}
.avis{font-size:14px;padding:10px 12px;border-radius:12px;margin-bottom:14px;background:#EEF7F0;color:#1F5E33}
.avis.ko{background:#FCEDEB;color:#8E2219}
.go{width:100%;height:52px;border-radius:14px;background:var(--t1);color:#fff;font-weight:600;font-size:16px}
.go:disabled{background:var(--s3);color:var(--t3)}

/* Minuteur de repos */
.bell{position:fixed;left:12px;right:12px;bottom:calc(env(safe-area-inset-bottom,0px) + 76px);max-width:536px;margin:0 auto;z-index:65;background:var(--t1);color:#fff;border-radius:18px;padding:12px 12px 12px 16px;display:flex;align-items:center;gap:14px;box-shadow:0 12px 32px rgba(20,18,15,.25);transform:translateY(calc(100% + 24px));visibility:hidden;transition:transform .3s cubic-bezier(.22,1,.36,1),visibility 0s .3s}
.bell.show{transform:none;visibility:visible;transition:transform .3s cubic-bezier(.22,1,.36,1)}
.bell .ring{width:44px;height:44px;flex:none}
.bell .ring circle{fill:none;stroke-width:4}
.bell .ring .bg{stroke:rgba(255,255,255,.18)}

/* Message */

.toast .ic{margin-top:2px}
.toast.ok .ic{color:var(--ok)}
.toast.ko .ic{color:var(--ko)}
.toast strong{display:block;font-weight:600}

.prog h2{font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:24px;margin:20px 0 10px}
.bloc-an{padding:16px;margin-bottom:12px}

.bloc-an .etapes span{height:8px;border-radius:4px;background:var(--s3)}
.bloc-an .etapes span.on{background:var(--gant)}
.bloc-an strong{font-weight:600}
.bloc-an p{color:var(--t2);font-size:14px}
.rec{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 16px;border-top:1px solid var(--hair)}

.rec b{font-weight:600;font-variant-numeric:tabular-nums}
.vide{padding:16px;color:var(--t2)}

.sond-r{color:var(--t2);margin-bottom:16px}

  if (!log[id]) log[id] = Array.from({ length: nbSeries(e) }, () => ({ kg: e.poidsCorps ? (prop.kg || '') : prop.kg, reps: '', ok: false }));
  const yt = 'https://www.youtube.com/results?search_query=' + encodeURIComponent(e.video);
  const ec = enCours();
  let h = `<button class="iconbtn" type="button" onclick="fermer()" aria-label="Retour">${I.down}</button>${ec ? `<span class="chrono-mini" id="chronoMini">${hms(Date.now() - ec.debut)}</span>` : ''}
    ${animation(id)}
    <h2 class="ex-title">${e.nom}</h2><p class="ex-meta num">${nbSeries(e)} séries de ${e.reps[0]} à ${e.reps[1]}${e.par ? ' ' + e.par : ''} · repos ${e.repos >= 60 ? (e.repos / 60).toString().replace('.', ',') + ' min' : e.repos + ' s'} · ${e.muscles}</p>
    <section class="card bloc"><h3>Comment faire</h3><ol>${e.etapes.map((x, i) => `<li><b>${i + 1}</b><span>${x}</span></li>`).join('')}</ol></section>
    <section class="card bloc"><h3>Les 2 erreurs à éviter</h3><ul>${e.erreurs.map(x => `<li>${I.x}<span>${x}</span></li>`).join('')}</ul></section>`;
  if (e.plusFacile || e.plusDur) h += `<p class="conseil">${e.plusFacile || e.plusDur}</p>`;
  h += `<div class="liens"><a class="lien" href="${yt}" target="_blank" rel="noopener">${I.play}Voir une démo</a><a class="lien" href="https://t.me/LdvkBOT" target="_blank" rel="noopener">${I.cam}Me faire vérifier</a></div>`;
  h += `<p class="conseil">${last ? 'La dernière fois : <b class="num">' + last.sets.map(s => (s.kg ? fmt(s.kg) + ' kg × ' : '') + s.reps).join(' · ') + '</b><br>' : ''}<span class="${prop.up ? 'up' : ''}">${prop.txt}</span></p>`;
  h += `<div class="sets" id="sets"></div><div id="sondFiche"></div>${boutonRemplacer(id, 'ouvrir')}<div class="row"><button class="btn btn-ghost" type="button" onclick="ajoutSerie()">Ajouter une série</button><button class="btn btn-main" type="button" onclick="fermer()">Exercice fini</button></div>${ec ? `<button class="lien-annuler" type="button" onclick="sauter('${id}')">Sauter cet exercice (machine prise, douleur…)</button>` : ''}`;
  document.getElementById('sheetBody').innerHTML = h; renderSets();
  const sh = document.getElementById('sheet'); sh.scrollTop = 0; sh.classList.add('open');
}
function renderSets() {
  const e = EX[cur], sets = jourLog()[cur];
  document.getElementById('sets').innerHTML = sets.map((s, i) => `<div class="set${s.ok ? ' on' : ''}"><span class="n num">${i + 1}</span>
    <label class="field"><input type="number" inputmode="decimal" step="0.5" min="0" placeholder="${e.poidsCorps ? '0' : '—'}" value="${s.kg}" aria-label="Série ${i + 1}, ${e.poidsCorps ? 'lest en kilos' : 'kilos'}" onchange="maj(${i},'kg',this.value)"><em>${e.poidsCorps ? 'lest' : 'kg'}</em></label>
    <label class="field"><input type="number" inputmode="numeric" min="0" placeholder="${e.reps[1]}" value="${s.reps}" aria-label="Série ${i + 1}, répétitions" onchange="maj(${i},'reps',this.value)"><em>rép.</em></label>
    <button type="button" class="check${s.ok ? ' on' : ''}" onclick="valider(${i})" aria-pressed="${s.ok}" aria-label="Série ${i + 1} faite">${I.check}</button></div>`).join('');
  const box = document.getElementById('sondFiche'); if (!box) return;
  box.innerHTML = sets.length && sets.every(s => s.ok) ? `<div class="sond-fiche"><h3>Comment c’était ? Je m’en sers pour ton poids de la prochaine fois</h3>${boutonsSondage(cur, `noterRessenti('${cur}','#R#');renderSets()`)}</div>` : '';
}
// ============ Ressenti après chaque exercice (comme Freeletics) ============
const RESSENTIS = [
  { k:'facile', t:'Trop facile', s:'J’en avais encore plein sous le pied', court:'Facile', c:'#2E8F4B' },
  { k:'bien', t:'Bien, j’ai forcé sur la fin', s:'Les dernières répétitions piquaient', court:'Bien', c:'#2F6BD0' },
  { k:'dur', t:'Dur, à la limite', s:'Plus une seule répétition en réserve', court:'Dur', c:'#D98B1F' },
  { k:'rate', t:'Pas réussi toutes les répétitions', s:'J’ai lâché avant la fin', court:'Raté', c:'#D43A2D' },
];
function origineDe(id) { return Object.keys(EX).find(o => EX[o].alt === id) || null; }
function boutonRemplacer(id, vue) {
  const o = origineDe(id), alt = EX[id].alt; if (!alt && !o) return '';
  if ((jourLog()[id] || []).some(z => z.ok)) return '';   // déjà des séries notées : on ne change plus en cours d'exercice
  return `<button class="btn btn-ghost" type="button" style="margin:0 0 8px" onclick="remplacer('${id}','${vue}')">${alt ? 'Remplacer par : ' + EX[alt].nom : 'Revenir au ' + EX[o].nom}</button>`;
}
function remplacer(id, vue) {
  const o = origineDe(id), nv = EX[id].alt || o; D.remplace = D.remplace || {};
  if (EX[id].alt) D.remplace[id] = nv; else delete D.remplace[o];
  const L = jourLog(); if (L[id] && !L[id].some(z => z.ok)) delete L[id];
  appliquerRemplacements(); save();
  toast({ ok:true, t:EX[id].alt ? 'Remplacé par ' + EX[nv].nom : 'Retour au ' + EX[nv].nom, s:'Gardé pour les prochaines séances. Ta progression est suivie à part.' });
  if (vue === 'guide' && enCours()) guide(); else ouvrir(nv);
}
function ressenti(d, id) { return ((D.ressenti || {})[d] || {})[id] || null; }
function noterRessenti(id, r, d) { D.ressenti = D.ressenti || {}; const k = d || iso(auj); (D.ressenti[k] = D.ressenti[k] || {})[id] = r; save(); if (navigator.vibrate) navigator.vibrate(12); }
function boutonsSondage(id, action, d) { const rs = ressenti(d || iso(auj), id); return `<div class="sondage" role="group" aria-label="Ressenti">${RESSENTIS.map(r => `<button type="button" class="${rs === r.k ? 'on' : ''}" aria-pressed="${rs === r.k}" style="--rc:${r.c}" onclick="${action.replace('#R#', r.k)}"><i></i><span><b>${r.t}</b><small>${r.s}</small></span></button>`).join('')}</div>`; }
function barreTxt(e, kg) { kg = Number(kg) || 0; const c = Math.round((kg - e.barre) / 2 * 100) / 100; const t = kg <= e.barre ? 'barre longue seule (~' + e.barre + ' kg)' : 'barre longue ~' + e.barre + ' kg + ' + fmt(c) + ' kg de chaque côté'; return e.barreFixe ? 'Barre fixe de ' + fmt(kg) + ' kg, ou ' + t : 'Soit ' + t; }
function pageSondage(id, reste) {
  const ec = enCours(), e = EX[id], ok = (jourLog()[id] || []).filter(z => z.ok);
  document.getElementById('sheetBody').innerHTML = `<div class="g-haut"><button class="iconbtn" type="button" onclick="fermer()" aria-label="Réduire">${I.down}</button><span>${e.nom} terminé</span><b class="num" id="chronoMini">${ec ? hms(Date.now() - ec.debut) : ''}</b></div>
    <h2 class="sond-q">Comment c’était ?</h2><p class="sond-r num">${ok.map(z => (e.poidsCorps ? (z.elas ? 'élastique × ' : z.kg ? '+' + fmt(z.kg) + ' kg × ' : '') : fmt(z.kg || 0) + ' kg × ') + z.reps).join(' · ')}. Ta réponse règle ton poids de la prochaine fois.</p>
    ${boutonsSondage(id, `repondre('${id}','#R#',${reste ? `'${reste}'` : 'null'})`)}
    <button class="lien-annuler" type="button" onclick="repondre('${id}',null,${reste ? `'${reste}'` : 'null'})">Passer</button>`;
  const sh = document.getElementById('sheet'); sh.scrollTop = 0; sh.classList.add('open');
}
function repondre(id, r, reste) {
  if (r) noterRessenti(id, r); const ec = enCours();
  if (!ec) return fermer();
  if (reste && ec.repos) return pageRepos(ec.repos.prevu, reste);
  document.getElementById('sheet').classList.remove('open'); finSeance(ec.k);
}
function maj(i, c, v) { jourLog()[cur][i][c] = v; save(); }
function valider(i) { const s = jourLog()[cur][i]; if (!s.ok && !s.reps) s.reps = EX[cur].reps[1]; s.ok = !s.ok; save(); renderSets(); if (s.ok) { if (navigator.vibrate) navigator.vibrate(20); repos(EX[cur].repos); } }
function ajoutSerie() { const sets = jourLog()[cur], l = sets[sets.length - 1] || {}; sets.push({ kg: l.kg || '', reps: '', ok: false }); save(); renderSets(); }
function fermer() { document.getElementById('sheet').classList.remove('open'); render(); }

// Minuteur de repos (cloche de round)
let tFin = 0, tTot = 0, tick = null, ac = null;
function repos(sec) {
  tTot = sec; tFin = Date.now() + sec * 1000; const b = document.getElementById('bell'); b.classList.remove('ding'); b.classList.add('show');
  document.getElementById('bellBtn').textContent = 'Passer';
  try { ac = ac || new (window.AudioContext || window.webkitAudioContext)(); ac.resume(); } catch (e) {}
  clearInterval(tick); majCloche(); tick = setInterval(majCloche, 250);
}
function majCloche() {
  const r = Math.max(0, Math.ceil((tFin - Date.now()) / 1000));
  document.getElementById('bellTime').textContent = Math.floor(r / 60) + ':' + String(r % 60).padStart(2, '0');
  document.getElementById('bellLabel').textContent = r ? 'Repos' : 'Ding, série suivante';
  document.getElementById('ringFg').style.strokeDashoffset = (113.1 * (1 - r / tTot)).toFixed(1);
  if (!r) { clearInterval(tick); sonner(); const b = document.getElementById('bell'); b.classList.add('ding'); document.getElementById('bellBtn').textContent = 'OK'; setTimeout(() => b.classList.remove('show'), 6000); }
}
function sonner() {
  if (navigator.vibrate) navigator.vibrate([200, 100, 200]); if (!ac) return;
  [0, .35].forEach(t0 => { const o = ac.createOscillator(), g = ac.createGain(); o.frequency.value = 1320; g.gain.setValueAtTime(.0001, ac.currentTime + t0); g.gain.exponentialRampToValueAtTime(.4, ac.currentTime + t0 + .01); g.gain.exponentialRampToValueAtTime(.0001, ac.currentTime + t0 + 1.1); o.connect(g).connect(ac.destination); o.start(ac.currentTime + t0); o.stop(ac.currentTime + t0 + 1.2); });
}
document.getElementById('bellBtn').onclick = () => { clearInterval(tick); document.getElementById('bell').classList.remove('show'); };

// ============ Progrès ============
function vueProgres() {
  const semaines = numSemaine(SEM), actives = Object.values(D.semaines).filter(w => Object.keys(w.faites || {}).length >= 2).length, bloc = blocDe(actives), legere = estLegere(semaines);
  let h = `<header class="top"><div><h1>Progrès</h1><p>Semaine ${semaines + 1} de ton programme</p></div>${serie() ? `<span class="pill num">${I.feu}${serie()}</span>` : ''}</header>
    <section class="card bloc-an"><strong>${BLOCS[bloc].nom}</strong><p>${BLOCS[bloc].obj}</p><div class="etapes">${BLOCS.slice(0, 4).map((b, i) => `<span class="${i <= bloc ? 'on' : ''}"></span>`).join('')}</div>
    <p>${legere ? 'Cette semaine est une semaine légère : 2 séries au lieu de 3, mêmes poids, pour récupérer.' : 'Une semaine légère toutes les 6 semaines (la prochaine : semaine ' + (Math.floor((semaines + 1) / 6) * 6 + 6) + '), et un test de tes records tous les 3 mois.'}</p></section>`;
  // Poids du corps : le vrai juge de la prise de masse
  const P = Object.keys(D.poids || {}).sort(), dernier = P.length ? D.poids[P[P.length - 1]] : null;
  let conseil = 'Pèse-toi 1 fois par semaine, le matin à jeun. Pour prendre du muscle : +0,5 à 1 kg par mois, environ 150 g de protéines par jour.';
  if (P.length >= 2) {
    const a = P.find(d => (new Date(P[P.length - 1]) - new Date(d)) / 86400000 <= 35) || P[0], jours = (new Date(P[P.length - 1]) - new Date(a)) / 86400000;
    if (jours >= 21) { const parMois = (dernier - D.poids[a]) * 30 / jours;
      conseil = parMois < 0.2 ? 'Tu ne prends presque pas (' + fmt(parMois.toFixed(1)) + ' kg/mois) : ajoute une collation (fromage blanc, banane, poignée d’amandes).' : parMois > 1.5 ? 'Tu prends vite (' + fmt(parMois.toFixed(1)) + ' kg/mois) : un peu moins de gras et de sucre, sinon c’est surtout du gras.' : 'Parfait : ' + fmt(parMois.toFixed(1)) + ' kg par mois, c’est le bon rythme pour du muscle.'; }
  }
  h += `<div class="prog"><h2>Poids du corps</h2><section class="card"><div class="rec"><div><b>${dernier ? fmt(dernier) + ' kg' : 'Pas encore noté'}</b><br><span>${P.length ? 'Départ ' + fmt(D.poids[P[0]]) + ' kg le ' + new Date(P[0] + 'T12:00').toLocaleDateString('fr-FR', { day:'numeric', month:'short' }) : '88 kg au départ'}</span></div>
    <label class="field" style="max-width:120px"><input type="number" inputmode="decimal" step="0.1" min="40" max="160" placeholder="${dernier ? fmt(dernier) : '88'}" aria-label="Poids du jour en kilos" onchange="notePoids(this.value)"><em>kg</em></label></div><p class="vide" style="text-align:left">${conseil}</p></section></div>`;
  // Les semaines : ce qui a été fait et ce qui a sauté (ça ne pénalise rien, ça se voit)
  const ks = []; for (let l = new Date(LUNDI); l >= lundiDe(new Date(D.debut + 'T12:00')) && ks.length < 12; l.setDate(l.getDate() - 7)) ks.push(iso(l));   // toutes les semaines, même celles où l'appli n'a pas été ouverte
  const passees = ks.filter(k => k !== SEM), faitesP = passees.reduce((n, k) => n + Object.keys((D.semaines[k] || {}).faites || {}).length, 0);
  h += `<div class="prog"><h2>Tes semaines</h2><section class="card">`;
  if (passees.length) h += `<p class="vide" style="text-align:left">Régularité : <b class="num">${faitesP} séance${faitesP > 1 ? 's' : ''} sur ${passees.length * 3}</b> ces ${passees.length} dernière${passees.length > 1 ? 's' : ''} semaine${passees.length > 1 ? 's' : ''}. Une séance sautée ne casse rien : la suivante reprend où tu en étais.</p>`;
  ks.forEach(k => { const w = D.semaines[k] || { faites:{} }, l = new Date(k + 'T12:00'), f = new Date(l); f.setDate(l.getDate() + 6);
    h += `<div class="rec"><div><b>${l.getDate()} → ${f.getDate()} ${f.toLocaleDateString('fr-FR', { month:'short' })}</b>${k === SEM ? '<br><span>en cours</span>' : estLegere(numSemaine(k)) ? '<br><span>semaine légère</span>' : ''}</div><b class="num">${['A','B','C'].map(x => x + (w.faites && w.faites[x] ? ' ✓' : k === SEM ? ' ·' : ' –')).join('  ')}</b></div>`; });
  h += `</section></div><div class="prog"><h2>Tes records</h2><section class="card">`;
  const recs = Object.keys(EX).map(id => { let best = null; Object.keys(D.log).forEach(d => (D.log[d][id] || []).filter(s => s.ok).forEach(s => { const v = EX[id].poidsCorps ? Number(s.reps) + (Number(s.kg) || 0) / 100 : Number(s.kg); if (v && (!best || v > best.v)) best = { v, d, reps: s.reps, kg: Number(s.kg) || 0 }; })); return best ? { id, best } : null; }).filter(Boolean);
  if (!recs.length) h += '<p class="vide">Tes records s’afficheront ici dès ta première séance.</p>';
  recs.forEach(r => h += `<div class="rec"><div><b>${EX[r.id].nom}</b><br><span>${new Date(r.best.d + 'T12:00').toLocaleDateString('fr-FR', { day:'numeric', month:'short' })}</span></div><b class="num">${EX[r.id].poidsCorps ? r.best.reps + ' rép.' + (r.best.kg ? ' + ' + fmt(r.best.kg) + ' kg' : '') : fmt(r.best.v) + ' kg × ' + r.best.reps}</b></div>`);
  h += `</section></div><p class="vide" style="text-align:left;margin-top:16px">${SYNC ? 'Sauvegarde automatique : chaque série part sur le Mac Mini (copie de chaque jour gardée 3 mois) et une copie part chaque lundi sur GitHub. Tu n’as rien à faire.' : 'Pas encore relié au robot, donc pas de sauvegarde automatique.'}</p>
    <p class="aide">Version 3.0 · ${SYNC ? 'Relié au robot : agenda et copie de secours automatiques.' : 'Pas relié au robot : supprime cette icône et rajoute-la depuis le lien Telegram.'}</p>`;
  document.getElementById('app').innerHTML = h;
}
function notePoids(v) { const x = Number(String(v).replace(',', '.')); if (!(x > 40 && x < 160)) return; D.poids = D.poids || {}; D.poids[iso(new Date())] = Math.round(x * 10) / 10; save(); render(); toast({ ok:true, t:'Poids noté', s:fmt(D.poids[iso(new Date())]) + ' kg' }); }
function exporter() { const blob = new Blob([JSON.stringify(D)], { type:'application/json' }), f = new File([blob], 'muscu-' + iso(auj) + '.json', { type:'application/json' }); if (navigator.canShare && navigator.canShare({ files:[f] })) navigator.share({ files:[f] }).catch(() => {}); else { const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = f.name; a.click(); } }
function importer() { const i = document.createElement('input'); i.type = 'file'; i.accept = '.json,application/json'; i.onchange = () => { const r = new FileReader(); r.onload = () => { try { const x = JSON.parse(r.result); if (x && x.semaines) { D = x; save(); render(); } } catch (e) {} }; r.readAsText(i.files[0]); }; i.click(); }

let tT;
function toast(v) { const t = document.getElementById('toast'); t.className = 'toast show ' + (v.ok ? 'ok' : 'ko'); document.getElementById('toastIc').innerHTML = v.ok ? '<path d="M5 12.5l4.5 4.5L19 7.5"/>' : '<path d="M12 4l9 16H3z"/><path d="M12 10v4M12 17.5v.5"/>'; document.getElementById('toastT').textContent = v.t; document.getElementById('toastS').textContent = v.s; clearTimeout(tT); tT = setTimeout(() => t.classList.remove('show'), 4200); }

// Le téléphone garde l'appli ouverte des jours : au retour, si on a changé de jour, on recharge pour repartir sur la bonne date
document.addEventListener('visibilitychange', () => { if (!document.hidden && iso(new Date()) !== iso(auj)) location.reload(); });
// 09/11 (séance A, à la salle) : rowing barre 20 kg et rowing un bras 15 kg trop faciles → base de la prochaine A, une seule fois, sans toucher au journal
if (!D.sugg0911) { D.force = Object.assign({}, D.force, { rowingbarre:{ d:'2026-11-09', kg:25, pq:'20 kg trop facile le 9/11' }, rowing1:{ d:'2026-11-09', kg:17, pq:'15 kg trop facile le 9/11' } });
  D.ressenti = D.ressenti || {}; D.ressenti['2026-11-09'] = Object.assign({ rowingbarre:'facile', rowing1:'facile' }, D.ressenti['2026-11-09']); D.sugg0911 = 1; save(); }
recaler();
render();
// envoi raté (salle sans réseau) : on renvoie dès que ça revient
try { if (localStorage.getItem('muscu-attente')) pousser(); } catch (e) {}
addEventListener('online', () => { try { if (localStorage.getItem('muscu-attente')) pousser(); } catch (e) {} });
chargerAgenda();
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
