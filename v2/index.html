<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#F5F4F1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Muscu">
<link rel="apple-touch-icon" href="../icon-180.png">
<link rel="icon" type="image/png" href="../icon-180.png">
<title>Muscu · Ludo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F5F4F1; --s1:#FFFFFF; --s2:#FBFAF8; --s3:#ECEAE5;
  --hair:rgba(20,18,15,.08); --hair2:rgba(20,18,15,.14);
  --t1:#16140F; --t2:#5B564E; --t3:#837D74;
  --gant:#D43A2D; --ok:#2E8F4B; --ko:#D43A2D;
  --A:#D43A2D; --B:#2F6BD0; --C:#7A52CC;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
body{font-family:'Barlow',system-ui,sans-serif;background:var(--bg);color:var(--t1);font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased;min-height:100dvh}
::selection{background:rgba(212,58,45,.2)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input{font:inherit;color:inherit}
a{color:inherit}
:focus-visible{outline:2px solid var(--gant);outline-offset:2px;border-radius:8px}
.num{font-variant-numeric:tabular-nums}
svg.ic{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round;flex:none}
.wrap{max-width:560px;margin:0 auto;padding:calc(env(safe-area-inset-top,0px) + 16px) 16px calc(env(safe-area-inset-bottom,0px) + 96px)}
h1{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:38px;line-height:1}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:16px}
.top p{color:var(--t2);font-size:15px;margin-top:4px}
.pill{display:flex;align-items:center;gap:6px;height:40px;padding:0 12px;border-radius:12px;background:var(--s1);border:1px solid var(--hair);font-weight:600;font-size:15px}
.pill svg{color:#C88A00}
.card{background:var(--s1);border:1px solid var(--hair);border-radius:16px}

/* Onglets du bas */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:40;background:rgba(255,255,255,.94);-webkit-backdrop-filter:saturate(1.4) blur(14px);backdrop-filter:saturate(1.4) blur(14px);border-top:1px solid var(--hair);padding:6px 8px calc(env(safe-area-inset-bottom,0px) + 6px)}
.tabs div{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr)}
.tabs button{display:flex;flex-direction:column;align-items:center;gap:2px;height:52px;justify-content:center;font-size:12px;font-weight:600;color:var(--t3);border-radius:12px}
.tabs button.on{color:var(--t1)}
.tabs button.on svg{color:var(--gant)}

/* Semaine */
.jauge{padding:14px 16px;margin-bottom:16px}
.jauge .l1{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:10px}
.jauge strong{font-family:'Barlow Condensed',sans-serif;font-size:22px;font-weight:700;white-space:nowrap}
.jauge small{color:var(--t2);font-size:14px;text-align:right}
.barres{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.barres span{height:8px;border-radius:4px;background:var(--s3)}
.barres span.fait{background:var(--ok)}
.barres span.cale{background:repeating-linear-gradient(90deg,var(--s3) 0 6px,rgba(20,18,15,.14) 6px 12px)}
.jours{display:flex;flex-direction:column;gap:8px}
.jour{display:grid;grid-template-columns:52px 1fr;gap:12px;padding:12px;border-radius:16px;background:var(--s1);border:1px solid var(--hair);min-height:72px;transition:border-color .15s,background-color .15s}
.jour.passe{opacity:.55}
.jour.auj{border-color:rgba(212,58,45,.35);box-shadow:0 2px 10px rgba(20,18,15,.05)}
.jour.cible-ok{border-color:var(--ok);background:#EEF7F0}
.jour.cible-ko{border-color:var(--ko);background:#FCEDEB}
.date{display:flex;flex-direction:column;align-items:center;padding-top:2px}
.date b{font-family:'Barlow Condensed',sans-serif;font-size:13px;font-weight:600;letter-spacing:.04em;color:var(--t3)}
.date strong{font-family:'Barlow Condensed',sans-serif;font-size:26px;font-weight:700;line-height:1.05}
.jour.auj .date b{color:var(--gant)}
.contenu{display:flex;flex-direction:column;gap:6px;min-width:0}
.ligne{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--t2);min-width:0}
.ligne .h{color:var(--t3);width:40px;flex:none}
.ligne .t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ligne.boxe .t{color:var(--t1);font-weight:500}
.ligne.boxe i{width:8px;height:8px;border-radius:2px;background:var(--t2);flex:none}
.libre{font-size:14px;color:var(--t3)}
.seance{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;background:var(--s2);border:1px solid var(--hair2);touch-action:none;cursor:grab;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
.seance::before{content:"";width:4px;align-self:stretch;border-radius:2px;background:var(--c)}
.seance .nom{font-weight:600;line-height:1.2}
.seance .nom span{color:var(--t2);font-weight:500}
.seance .sous{font-size:13px;color:var(--t2)}
.seance .txt{flex:1;min-width:0}
.seance .grip{color:var(--t3)}
.seance.faite{cursor:default;background:var(--bg)}
.seance.faite .nom{color:var(--t2)}
.seance.faite .grip{color:var(--ok)}
.seance.fantome{position:fixed;z-index:50;pointer-events:none;background:#fff;box-shadow:0 14px 32px rgba(20,18,15,.18);transform:rotate(-1.5deg) scale(1.03)}
.seance.origine{opacity:.25}
.aide{color:var(--t3);font-size:13px;text-align:center;margin-top:16px}

/* Séance */
.sess{padding:18px 16px 8px}
.sess h2{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:30px;line-height:1.05;display:flex;align-items:center;gap:10px}
.sess h2 i{width:12px;height:12px;border-radius:3px;background:var(--c);flex:none}
.sess p{color:var(--t2);font-size:15px;margin-top:4px}
.choixS{display:flex;gap:8px;margin-bottom:12px}
.choixS button{flex:1;height:44px;border-radius:12px;border:1px solid var(--hair2);font-weight:600;background:var(--s1)}
.choixS button.on{background:var(--t1);border-color:var(--t1);color:#fff}
.ex{display:flex;align-items:center;gap:14px;padding:12px 16px;width:100%;text-align:left;border-top:1px solid var(--hair)}
.ex:active{background:var(--s2)}
.ex .thumb{width:64px;height:48px;border-radius:8px;object-fit:cover;background:var(--s3);flex:none}
.ex .txt{flex:1;min-width:0}
.ex .txt strong{display:block;font-weight:600;line-height:1.25}
.ex .txt small{color:var(--t2);font-size:14px}
.ex .state{color:var(--t3)}
.ex.done .state{color:var(--ok)}
.ex.done .txt strong{color:var(--t2)}
.fin{padding:12px 16px 16px;border-top:1px solid var(--hair)}

/* Fiche exercice = le cours */
.sheet{position:fixed;inset:0;background:var(--bg);z-index:60;overflow-y:auto;transform:translateY(100%);transition:transform .32s cubic-bezier(.22,1,.36,1);visibility:hidden}
.sheet.open{transform:none;visibility:visible}
.sheet .wrap{padding-top:calc(env(safe-area-inset-top,0px) + 12px);padding-bottom:calc(env(safe-area-inset-bottom,0px) + 110px)}
.iconbtn{width:44px;height:44px;display:grid;place-items:center;border-radius:12px;color:var(--t2);background:var(--s1);border:1px solid var(--hair)}
.anim{position:relative;aspect-ratio:3/2;border-radius:16px;overflow:hidden;background:#fff;margin:12px 0 16px;border:1px solid var(--hair)}
.anim img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.anim img+img{animation:flip 2.6s ease-in-out infinite}
.anim .lab{position:absolute;left:10px;bottom:10px;background:rgba(255,255,255,.92);border-radius:8px;padding:4px 8px;font-size:12px;font-weight:600;color:var(--t2)}
@keyframes flip{0%,38%{opacity:0}50%,88%{opacity:1}100%{opacity:0}}
@media (prefers-reduced-motion:reduce){.anim img+img{animation:none;opacity:0}}
.ex-title{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:34px;line-height:1.05}
.ex-meta{color:var(--t2);margin:6px 0 14px}
.bloc{padding:14px 16px;margin-bottom:10px}
.bloc h3{font-size:14px;font-weight:600;color:var(--t2);margin-bottom:8px}
.bloc ol,.bloc ul{list-style:none;display:flex;flex-direction:column;gap:8px}
.bloc li{display:flex;gap:10px;font-size:15px}
.bloc ol li b{width:22px;height:22px;border-radius:50%;background:var(--t1);color:#fff;font-size:12px;display:grid;place-items:center;flex:none;margin-top:1px}
.bloc ul li svg{color:var(--ko);margin-top:1px;width:18px;height:18px}
.liens{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:16px}
.lien{display:flex;align-items:center;justify-content:center;gap:8px;height:48px;border-radius:12px;border:1px solid var(--hair2);background:var(--s1);font-weight:600;font-size:15px;text-decoration:none}
.conseil{font-size:14px;color:var(--t2);background:var(--s1);border:1px solid var(--hair);border-radius:12px;padding:10px 12px;margin-bottom:12px}
.conseil b{color:var(--t1)}
.conseil .up{color:var(--ok);font-weight:600}
.sets{display:flex;flex-direction:column;gap:8px;margin-bottom:14px}
.set{display:grid;grid-template-columns:28px 1fr 1fr 48px;gap:8px;align-items:center}
.set .n{font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:18px;color:var(--t3);text-align:center}
.field{position:relative}
.field input{width:100%;height:48px;border-radius:10px;background:var(--s1);border:1px solid var(--hair2);padding:0 40px 0 14px;font-size:18px;font-weight:600;font-variant-numeric:tabular-nums;-moz-appearance:textfield;caret-color:var(--gant)}
.field input::-webkit-outer-spin-button,.field input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.field input:focus{border-color:var(--t2);outline:none}
.field input::placeholder{color:var(--t3);font-weight:500}
.field em{position:absolute;right:12px;top:50%;transform:translateY(-50%);font-style:normal;color:var(--t3);font-size:14px;pointer-events:none}
.check{width:48px;height:48px;border-radius:12px;border:1.5px solid var(--hair2);display:grid;place-items:center;color:transparent;background:var(--s1);transition:background-color .2s,border-color .2s,color .2s}
.check.on{background:var(--ok);border-color:var(--ok);color:#fff}
.set.on .field input{color:var(--t2)}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;height:52px;border-radius:14px;font-weight:600;font-size:16px}
.btn-main{background:var(--t1);color:#fff}
.btn-ghost{background:var(--s1);border:1px solid var(--hair2)}
.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}

/* Panneau jour + heure */
.voile{position:fixed;inset:0;background:rgba(20,18,15,.28);z-index:70;opacity:0;visibility:hidden;transition:opacity .2s,visibility 0s .2s}
.voile.show{opacity:1;visibility:visible;transition:opacity .2s}
.panneau{position:fixed;left:0;right:0;bottom:0;z-index:80;background:var(--s1);border-radius:22px 22px 0 0;padding:12px 16px calc(env(safe-area-inset-bottom,0px) + 16px);max-width:560px;margin:0 auto;transform:translateY(105%);transition:transform .3s cubic-bezier(.22,1,.36,1);box-shadow:0 -8px 30px rgba(20,18,15,.12)}
.panneau.show{transform:none}
.poignee{width:40px;height:5px;border-radius:3px;background:var(--s3);margin:0 auto 14px}
.panneau h2{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:26px;line-height:1.1}
.panneau .sous{color:var(--t2);font-size:14px;margin:2px 0 16px}
.panneau h3{font-size:14px;font-weight:600;color:var(--t2);margin:0 0 8px}
.choix{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:18px}
.choix button{height:56px;border-radius:12px;border:1px solid var(--hair2);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px}
.choix button b{font-family:'Barlow Condensed',sans-serif;font-size:12px;font-weight:600;color:var(--t3);letter-spacing:.04em}
.choix button span{font-weight:600;font-size:17px;font-variant-numeric:tabular-nums}
.choix button.ko{background:var(--bg);color:var(--t3);border-color:transparent}
.choix button.ko span{text-decoration:line-through;text-decoration-color:var(--ko);text-decoration-thickness:2px}
.choix button.sel{background:var(--t1);border-color:var(--t1);color:#fff}
.choix button.sel b{color:rgba(255,255,255,.7)}
.heures{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.heures button{height:44px;padding:0 14px;border-radius:12px;border:1px solid var(--hair2);font-weight:600;font-variant-numeric:tabular-nums}
.heures button.sel{background:var(--t1);border-color:var(--t1);color:#fff}
.heures input{height:44px;border-radius:12px;border:1px solid var(--hair2);padding:0 10px;font-weight:600;background:var(--s1)}
.avis{font-size:14px;padding:10px 12px;border-radius:12px;margin-bottom:14px;background:#EEF7F0;color:#1F5E33}
.avis.ko{background:#FCEDEB;color:#8E2219}
.go{width:100%;height:52px;border-radius:14px;background:var(--t1);color:#fff;font-weight:600;font-size:16px}
.go:disabled{background:var(--s3);color:var(--t3)}

/* Minuteur de repos */
.bell{position:fixed;left:12px;right:12px;bottom:calc(env(safe-area-inset-bottom,0px) + 76px);max-width:536px;margin:0 auto;z-index:65;background:var(--t1);color:#fff;border-radius:18px;padding:12px 12px 12px 16px;display:flex;align-items:center;gap:14px;box-shadow:0 12px 32px rgba(20,18,15,.25);transform:translateY(calc(100% + 24px));visibility:hidden;transition:transform .3s cubic-bezier(.22,1,.36,1),visibility 0s .3s}
.bell.show{transform:none;visibility:visible;transition:transform .3s cubic-bezier(.22,1,.36,1)}
.bell .ring{width:44px;height:44px;flex:none}
.bell .ring circle{fill:none;stroke-width:4}
.bell .ring .bg{stroke:rgba(255,255,255,.18)}
.bell .ring .fg{stroke:var(--gant);stroke-linecap:round;transform:rotate(-90deg);transform-origin:50% 50%;transition:stroke-dashoffset 1s linear}
.bell .txt{flex:1}
.bell .txt strong{font-family:'Barlow Condensed',sans-serif;font-size:28px;font-weight:700;line-height:1}
.bell .txt small{display:block;color:rgba(255,255,255,.7);font-size:13px}
.bell.ding{background:var(--gant)}
.bell.ding .ring .fg{stroke:#fff}
.bell button{height:44px;padding:0 14px;border-radius:12px;background:rgba(255,255,255,.14);font-weight:600;font-size:15px}

/* Message */
.toast{position:fixed;left:12px;right:12px;bottom:calc(env(safe-area-inset-bottom,0px) + 76px);max-width:536px;margin:0 auto;z-index:90;background:var(--s1);border:1px solid var(--hair2);border-radius:16px;padding:14px 16px;display:flex;gap:12px;align-items:flex-start;box-shadow:0 12px 28px rgba(20,18,15,.14);transform:translateY(calc(100% + 100px));visibility:hidden;transition:transform .3s cubic-bezier(.22,1,.36,1),visibility 0s .3s}
.toast.show{transform:none;visibility:visible;transition:transform .3s cubic-bezier(.22,1,.36,1)}
.toast .ic{margin-top:2px}
.toast.ok .ic{color:var(--ok)}
.toast.ko .ic{color:var(--ko)}
.toast strong{display:block;font-weight:600}
.toast small{color:var(--t2);font-size:14px}

/* Progrès */
.prog h2{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:24px;margin:20px 0 10px}
.bloc-an{padding:16px;margin-bottom:12px}
.bloc-an .etapes{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:12px 0 8px}
.bloc-an .etapes span{height:8px;border-radius:4px;background:var(--s3)}
.bloc-an .etapes span.on{background:var(--gant)}
.bloc-an strong{font-weight:600}
.bloc-an p{color:var(--t2);font-size:14px}
.rec{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 16px;border-top:1px solid var(--hair)}
.rec:first-child{border-top:0}
.rec span{color:var(--t2);font-size:14px}
.rec b{font-weight:600;font-variant-numeric:tabular-nums}
.vide{padding:16px;color:var(--t2)}
</style>
</head>
<body>
<main class="wrap" id="app"></main>
<nav class="tabs" aria-label="Navigation"><div>
  <button type="button" data-tab="semaine" onclick="aller('semaine')"><svg class="ic" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>Semaine</button>
  <button type="button" data-tab="seance" onclick="aller('seance')"><svg class="ic" viewBox="0 0 24 24"><path d="M6.5 6.5v11M17.5 6.5v11M3.5 9v6M20.5 9v6M6.5 12h11"/></svg>Séance</button>
  <button type="button" data-tab="progres" onclick="aller('progres')"><svg class="ic" viewBox="0 0 24 24"><path d="M4 19V5M4 19h16M8 15l4-4 3 3 5-6"/></svg>Progrès</button>
</div></nav>
<section class="sheet" id="sheet" role="dialog" aria-label="Exercice"><div class="wrap" id="sheetBody"></div></section>
<div class="voile" id="voile" onclick="if (Date.now() - ouvertA > 450) fermerPanneau()"></div>
<section class="panneau" id="panneau" role="dialog" aria-label="Déplacer la séance"></section>
<div class="bell" id="bell" role="status" aria-live="polite">
  <svg class="ring" viewBox="0 0 44 44" aria-hidden="true"><circle class="bg" cx="22" cy="22" r="18"/><circle class="fg" id="ringFg" cx="22" cy="22" r="18" stroke-dasharray="113.1" stroke-dashoffset="0"/></svg>
  <div class="txt"><strong class="num" id="bellTime">1:30</strong><small id="bellLabel">Repos</small></div>
  <button type="button" id="bellBtn">Passer</button>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"><svg class="ic" viewBox="0 0 24 24" id="toastIc"></svg><div><strong id="toastT"></strong><small id="toastS"></small></div></div>

<script src="agenda.js"></script>
<script>
// ============ Le programme ============
// Ludo : 1,84 m, 88 kg, sportif depuis 4 mois (circuit training le matin, 100 pompes par jour), novice en muscu.
// But : compenser les pompes (pecs, triceps) en travaillant le dos, le tirage, les biceps, l'arrière d'épaule.
// Salle : haltères, barres fixes, banc, barre olympique, barre de traction basse. Pas de poulie.
const EX = {
  rowingbarre:{nom:'Rowing barre',img:'Bent_Over_Barbell_Row',series:3,reps:[8,10],repos:90,pas:2.5,depart:30,muscles:'Milieu du dos, grand dorsal',
    etapes:['Pieds largeur de hanches, genoux un peu fléchis','Penche le buste à 45°, dos bien plat, regard au sol devant toi','Tire la barre vers le bas du ventre en serrant les omoplates','Redescends en 2 secondes jusqu’à bras tendus'],
    erreurs:['Dos rond : baisse le poids tout de suite','Se redresser pour tirer : le buste reste fixe'], video:'rowing barre buste penché technique'},
  rowing1:{nom:'Rowing haltère un bras',img:'One-Arm_Dumbbell_Row',series:3,reps:[8,12],repos:75,pas:2,depart:16,muscles:'Grand dorsal',par:'par bras',
    etapes:['Genou et main du même côté sur le banc','Dos plat, parallèle au sol','Tire l’haltère vers la hanche, coude près du corps','10 par bras, puis change de côté'],
    erreurs:['Tourner le buste pour monter','Tirer vers l’épaule au lieu de la hanche'], video:'rowing haltère un bras technique'},
  curlbarre:{nom:'Curl barre',img:'Barbell_Curl',series:3,reps:[8,10],repos:75,pas:2.5,depart:20,muscles:'Biceps',
    etapes:['Debout, une barre fixe du rack, mains largeur d’épaules','Coudes collés aux côtes','Monte la barre jusqu’à la poitrine','Redescends lentement jusqu’en bas'],
    erreurs:['Balancer le dos pour monter','Avancer les coudes en haut'], video:'curl barre biceps technique'},
  marteau:{nom:'Curl marteau',img:'Hammer_Curls',series:3,reps:[10,12],repos:60,pas:2,depart:10,muscles:'Biceps, avant-bras',
    etapes:['Un haltère dans chaque main, paumes face à face','Coudes fixes contre le corps','Monte jusqu’à l’épaule','Descends en 2 secondes'],
    erreurs:['Lever le coude','Monter trop vite avec de l’élan'], video:'curl marteau haltères technique'},

// ============ Données (sur ce téléphone, sauvegarde possible) ============

function iso(d) { const x = new Date(d); x.setHours(12, 0, 0, 0); x.setMinutes(x.getMinutes() - x.getTimezoneOffset()); return x.toISOString().slice(0, 10); }

// ============ Semaine ============
const min = h => +h.slice(0, 2) * 60 + +h.slice(3);

function rdv(j) { const l = (AGENDA[iso(dateJ(j))] || []).slice(); if (BOXE.includes(j) && !l.some(a => /boxe|temple/i.test(a.t))) l.push({ h:'11:20', t:'Boxe (circuit training)', boxe:true }); return l.sort((a, b) => a.h.localeCompare(b.h)); }
function verdict(k, j, heure) {
  const S = semaine(), h = heure || S.place[k].h;
  if (j < AUJ) return { ok:false, t:'Ce jour est passé', s:'Choisis aujourd’hui ou un jour qui vient.' };
  if (j === 6) return { ok:false, t:'Le dimanche, c’est repos', s:'Ta règle : jamais de séance le dimanche.' };
  for (const x of Object.keys(S.place)) {
    if (x === k || S.place[x].j == null) continue;
    if (S.place[x].j === j) return { ok:false, t:'Déjà une séance ce jour-là', s:'Une seule séance par jour.' };
    if (Math.abs(S.place[x].j - j) === 1) return { ok:false, t:'Trop près de la séance ' + x, s:'Garde un jour de repos entre deux séances pour que le dos récupère.' };
  }
  if (j === AUJ && min(h) < new Date().getHours() * 60 + new Date().getMinutes()) return { ok:false, t:'Cette heure est passée', s:'Choisis une heure plus tard aujourd’hui.' };
  const conflit = rdv(j).find(a => Math.abs(min(a.h) - min(h)) < 60);
  if (conflit) return { ok:true, t:'Possible ' + NOMS[j], s:conflit.t + ' à ' + conflit.h + ' : je la décale à ' + plus(conflit.h, 90) + '.', heure:plus(conflit.h, 90) };
  return { ok:true, t:'Calé ' + NOMS[j] + ' à ' + h, s:BOXE.includes(j) ? 'Jour de boxe : le soir, c’est bon. Bois bien.' : 'Rappel le matin même.' };
}
function serie() {   // semaines complètes d'affilée (la semaine en cours compte si elle est déjà complète)

}
function vueSemaine() {
  const S = semaine(), faites = Object.keys(S.faites).length, restantes = ['A','B','C'].filter(k => !S.faites[k]);
  const fin = dateJ(6);

// Panneau jour + heure
let choix = null, ouvertA = 0;
function creneaux(j) { const pris = rdv(j).map(a => min(a.h)); return ['07:00','12:30','14:00','17:00','18:30','20:00'].filter(h => pris.every(p => Math.abs(p - min(h)) >= 75)).slice(0, 4); }
function ouvrirPanneau(k) { const p = semaine().place[k]; choix = { k, j: p.j, h: p.h }; ouvertA = Date.now(); dessinerPanneau(); document.getElementById('voile').classList.add('show'); document.getElementById('panneau').classList.add('show'); }
function fermerPanneau() { document.getElementById('voile').classList.remove('show'); document.getElementById('panneau').classList.remove('show'); }
function dessinerPanneau() {
  const k = choix.k, s = SEANCES[k], v = choix.j == null ? { ok:false, t:'Choisis un jour', s:'' } : verdict(k, choix.j, choix.h);

// Glisser au doigt
function brancher() {
  document.querySelectorAll('.seance:not(.faite)').forEach(el => el.addEventListener('pointerdown', e => {
    const k = el.dataset.s, r = el.getBoundingClientRect(), dx = e.clientX - r.left, dy = e.clientY - r.top, x0 = e.clientX, y0 = e.clientY;
    let fantome = null, cible = null, pos = e, defile = null;
    try { el.setPointerCapture(e.pointerId); } catch (er) {}
    const appui = setTimeout(demarrer, 220);
    function demarrer() {
      fantome = el.cloneNode(true); fantome.classList.add('fantome'); fantome.style.width = r.width + 'px';
      document.body.appendChild(fantome); el.classList.add('origine'); bouger(pos); if (navigator.vibrate) navigator.vibrate(12);
      defile = setInterval(() => { const y = pos.clientY, H = innerHeight; if (y > H - 120) scrollBy(0, 14); else if (y < 90) scrollBy(0, -14); else return; bouger(pos); }, 16);
    }
    function bouger(ev) {
      pos = ev; if (!fantome) { if (Math.hypot(ev.clientX - x0, ev.clientY - y0) > 10) { clearTimeout(appui); nettoyer(); } return; }
      fantome.style.left = (ev.clientX - dx) + 'px'; fantome.style.top = (ev.clientY - dy) + 'px';
      const sous = document.elementsFromPoint(ev.clientX, ev.clientY).find(n => n.classList && n.classList.contains('jour'));
      document.querySelectorAll('.jour').forEach(n => n.classList.remove('cible-ok', 'cible-ko'));
      cible = sous ? +sous.dataset.j : null;
      if (sous && cible !== semaine().place[k].j) sous.classList.add(verdict(k, cible).ok ? 'cible-ok' : 'cible-ko');
    }
    function nettoyer() { el.removeEventListener('pointermove', bouger); el.removeEventListener('pointerup', fin); el.removeEventListener('pointercancel', fin); clearInterval(defile); }
    function fin(ev) {
      clearTimeout(appui); nettoyer();
      if (!fantome) { if (ev.type === 'pointerup' && Math.hypot(ev.clientX - x0, ev.clientY - y0) < 10) ouvrirPanneau(k); return; }
      fantome.remove(); el.classList.remove('origine');
      const p = semaine().place[k];
      if (cible != null && cible !== p.j) { const v = verdict(k, cible); toast(v); if (v.ok) { p.j = cible; if (v.heure) p.h = v.heure; save(); } }
      render();
    }
    el.addEventListener('pointermove', bouger); el.addEventListener('pointerup', fin); el.addEventListener('pointercancel', fin);
  }));
}

// ============ Séance du jour ============
function seanceDuJour() { const S = semaine(); return Object.keys(S.place).find(k => S.place[k].j === AUJ) || ['A','B','C'].find(k => !S.faites[k]) || 'A'; }
function vueSeance() {
  const S = semaine(); if (!seanceVue) seanceVue = seanceDuJour();
  const k = seanceVue, s = SEANCES[k], prevue = S.place[k].j === AUJ, log = jourLog();
  let h = `<header class="top"><div><h1>Séance</h1><p>${prevue ? 'Prévue aujourd’hui à ' + S.place[k].h : S.faites[k] ? 'Déjà faite cette semaine' : (S.place[k].j != null ? 'Prévue ' + NOMS[S.place[k].j] : 'Pas encore calée')}</p></div></header>
    <div class="choixS">${['A','B','C'].map(x => `<button type="button" class="${x === k ? 'on' : ''}" onclick="seanceVue='${x}';render()">${x}${S.faites[x] ? ' ✓' : ''}</button>`).join('')}</div>

  s.liste.forEach(id => {

    h += `<button type="button" class="ex${ok ? ' done' : ''}" onclick="ouvrir('${id}')"><img class="thumb" src="../img/${e.img}-0.webp" alt="" loading="lazy">

  });
  const tout = s.liste.every(id => (log[id] || []).filter(z => z.ok).length >= EX[id].series);
  h += `<div class="fin"><button class="btn ${tout ? 'btn-main' : 'btn-ghost'}" type="button" onclick="terminer('${k}')">${S.faites[k] ? 'Séance validée' : 'Terminer la séance'}</button></div></section>`;
  document.getElementById('app').innerHTML = h;
}
function jourLog(d) { const k = d || iso(auj); return (D.log[k] = D.log[k] || {}); }
function terminer(k) {
  const S = semaine(), log = jourLog(), faits = SEANCES[k].liste.filter(id => (log[id] || []).some(z => z.ok)).length;
  if (!faits) return toast({ ok:false, t:'Rien de noté', s:'Coche au moins une série pour valider la séance.' });
  S.faites[k] = iso(auj); S.place[k].j = AUJ; save();
  const n = Object.keys(S.faites).length;
  toast({ ok:true, t:SEANCES[k].nom + ' validée', s:n >= 3 ? 'Semaine complète 🔥' : (3 - n) + ' séance' + (3 - n > 1 ? 's' : '') + ' encore cette semaine.' });
  render();
}

// Progression : double progression. Toutes les séries en haut de la fourchette → la fois d'après, + le pas.
const fmt = v => String(v).replace('.', ',');
function historique(id) { return Object.keys(D.log).filter(d => d < iso(auj) && D.log[d][id] && D.log[d][id].some(z => z.ok)).sort().map(d => ({ d, sets: D.log[d][id].filter(z => z.ok) })); }
function propose(id) {
  const e = EX[id], h = historique(id), last = h[h.length - 1];
  if (!last) return { kg: e.poidsCorps ? 0 : e.depart, test: true, txt: e.poidsCorps ? 'Première fois : fais le maximum propre à chaque série.' : 'Première fois : commence à ' + fmt(e.depart) + ' kg. Si les ' + e.reps[1] + ' répétitions passent facilement, prends plus lourd à la série suivante.' };
  const kg = Math.max(...last.sets.map(s => Number(s.kg) || 0)), top = last.sets.length >= e.series && last.sets.every(s => Number(s.reps) >= e.reps[1]);
  if (e.poidsCorps) return { kg: 0, txt: top ? 'Toutes tes séries à ' + e.reps[1] + ' : passe à la version plus dure.' : 'Essaie de faire 1 répétition de plus que la dernière fois.' };
  if (top) return { kg: kg + e.pas, up: true, txt: 'Toutes tes séries à ' + e.reps[1] + ' la dernière fois : on monte à ' + fmt(kg + e.pas) + ' kg.' };
  return { kg, txt: 'Même poids que la dernière fois, vise ' + e.reps[1] + ' répétitions partout.' };
}

// La fiche = le cours de l'exercice
let cur = null;
function ouvrir(id) {
  cur = id; const e = EX[id], log = jourLog(), prop = propose(id), h0 = historique(id), last = h0[h0.length - 1];
  if (!log[id]) log[id] = Array.from({ length: e.series }, () => ({ kg: e.poidsCorps ? '' : prop.kg, reps: '', ok: false }));
  const yt = 'https://www.youtube.com/results?search_query=' + encodeURIComponent(e.video);
  let h = `<button class="iconbtn" type="button" onclick="fermer()" aria-label="Retour">${I.down}</button>
    <div class="anim"><img src="../img/${e.img}-0.webp" alt="${e.nom}, départ"><img src="../img/${e.img}-1.webp" alt="${e.nom}, arrivée"><span class="lab">départ, puis arrivée</span></div>
    <h2 class="ex-title">${e.nom}</h2><p class="ex-meta num">${e.series} séries de ${e.reps[0]} à ${e.reps[1]}${e.par ? ' ' + e.par : ''} · repos ${e.repos >= 60 ? (e.repos / 60).toString().replace('.', ',') + ' min' : e.repos + ' s'} · ${e.muscles}</p>
    <section class="card bloc"><h3>Comment faire</h3><ol>${e.etapes.map((x, i) => `<li><b>${i + 1}</b><span>${x}</span></li>`).join('')}</ol></section>
    <section class="card bloc"><h3>Les 2 erreurs à éviter</h3><ul>${e.erreurs.map(x => `<li>${I.x}<span>${x}</span></li>`).join('')}</ul></section>`;
  if (e.plusFacile || e.plusDur) h += `<p class="conseil">${e.plusFacile || e.plusDur}</p>`;
  h += `<div class="liens"><a class="lien" href="${yt}" target="_blank" rel="noopener">${I.play}Voir une démo</a><a class="lien" href="https://t.me/LdvkBOT" target="_blank" rel="noopener">${I.cam}Me faire vérifier</a></div>`;
  h += `<p class="conseil">${last ? 'La dernière fois : <b class="num">' + last.sets.map(s => (s.kg ? fmt(s.kg) + ' kg × ' : '') + s.reps).join(' · ') + '</b><br>' : ''}<span class="${prop.up ? 'up' : ''}">${prop.txt}</span></p>`;
  h += `<div class="sets" id="sets"></div><div class="row"><button class="btn btn-ghost" type="button" onclick="ajoutSerie()">Ajouter une série</button><button class="btn btn-main" type="button" onclick="fermer()">Exercice fini</button></div>`;
  document.getElementById('sheetBody').innerHTML = h; renderSets();
  const sh = document.getElementById('sheet'); sh.scrollTop = 0; sh.classList.add('open');
}
function renderSets() {
  const e = EX[cur], sets = jourLog()[cur];
  document.getElementById('sets').innerHTML = sets.map((s, i) => `<div class="set${s.ok ? ' on' : ''}"><span class="n num">${i + 1}</span>
    ${e.poidsCorps ? '<span class="num" style="color:var(--t3);font-size:14px;text-align:center">poids du corps</span>' : `<label class="field"><input type="number" inputmode="decimal" step="0.5" min="0" placeholder="—" value="${s.kg}" aria-label="Série ${i + 1}, kilos" onchange="maj(${i},'kg',this.value)"><em>kg</em></label>`}
    <label class="field"><input type="number" inputmode="numeric" min="0" placeholder="${e.reps[1]}" value="${s.reps}" aria-label="Série ${i + 1}, répétitions" onchange="maj(${i},'reps',this.value)"><em>rép.</em></label>
    <button type="button" class="check${s.ok ? ' on' : ''}" onclick="valider(${i})" aria-pressed="${s.ok}" aria-label="Série ${i + 1} faite">${I.check}</button></div>`).join('');
}
function maj(i, c, v) { jourLog()[cur][i][c] = v; save(); }
function valider(i) { const s = jourLog()[cur][i]; if (!s.ok && !s.reps) s.reps = EX[cur].reps[0]; s.ok = !s.ok; save(); renderSets(); if (s.ok) { if (navigator.vibrate) navigator.vibrate(20); repos(EX[cur].repos); } }
function ajoutSerie() { const sets = jourLog()[cur], l = sets[sets.length - 1] || {}; sets.push({ kg: l.kg || '', reps: '', ok: false }); save(); renderSets(); }
function fermer() { document.getElementById('sheet').classList.remove('open'); render(); }

// Minuteur de repos (cloche de round)
let tFin = 0, tTot = 0, tick = null, ac = null;
function repos(sec) {
  tTot = sec; tFin = Date.now() + sec * 1000; const b = document.getElementById('bell'); b.classList.remove('ding'); b.classList.add('show');
  document.getElementById('bellBtn').textContent = 'Passer';
  try { ac = ac || new (window.AudioContext || window.webkitAudioContext)(); ac.resume(); } catch (e) {}
  clearInterval(tick); majCloche(); tick = setInterval(majCloche, 250);
}
function majCloche() {
  const r = Math.max(0, Math.ceil((tFin - Date.now()) / 1000));
  document.getElementById('bellTime').textContent = Math.floor(r / 60) + ':' + String(r % 60).padStart(2, '0');
  document.getElementById('bellLabel').textContent = r ? 'Repos' : 'Ding, série suivante';
  document.getElementById('ringFg').style.strokeDashoffset = (113.1 * (1 - r / tTot)).toFixed(1);
  if (!r) { clearInterval(tick); sonner(); const b = document.getElementById('bell'); b.classList.add('ding'); document.getElementById('bellBtn').textContent = 'OK'; setTimeout(() => b.classList.remove('show'), 6000); }
}
function sonner() {
  if (navigator.vibrate) navigator.vibrate([200, 100, 200]); if (!ac) return;
  [0, .35].forEach(t0 => { const o = ac.createOscillator(), g = ac.createGain(); o.frequency.value = 1320; g.gain.setValueAtTime(.0001, ac.currentTime + t0); g.gain.exponentialRampToValueAtTime(.4, ac.currentTime + t0 + .01); g.gain.exponentialRampToValueAtTime(.0001, ac.currentTime + t0 + 1.1); o.connect(g).connect(ac.destination); o.start(ac.currentTime + t0); o.stop(ac.currentTime + t0 + 1.2); });
}
document.getElementById('bellBtn').onclick = () => { clearInterval(tick); document.getElementById('bell').classList.remove('show'); };

// ============ Progrès ============
function vueProgres() {
  const semaines = Math.floor((auj - new Date(D.debut + 'T12:00')) / (7 * 86400000)), bloc = Math.min(3, Math.floor(semaines / 13)), legere = semaines > 0 && (semaines + 1) % 6 === 0;
  let h = `<header class="top"><div><h1>Progrès</h1><p>Semaine ${semaines + 1} de ton année</p></div><span class="pill num">${I.feu}${serie()}</span></header>
    <section class="card bloc-an"><strong>${BLOCS[bloc].nom}</strong><p>${BLOCS[bloc].obj}</p><div class="etapes">${BLOCS.map((b, i) => `<span class="${i <= bloc ? 'on' : ''}"></span>`).join('')}</div>
    <p>${legere ? 'Cette semaine est une semaine légère : mêmes exercices, 2 séries au lieu de 3, pour récupérer.' : 'Une semaine légère toutes les 6 semaines, et un test de tes records tous les 3 mois.'}</p></section>
    <div class="prog"><h2>Tes records</h2><section class="card">`;
  const recs = Object.keys(EX).map(id => { let best = null; Object.keys(D.log).forEach(d => (D.log[d][id] || []).filter(s => s.ok).forEach(s => { const v = EX[id].poidsCorps ? Number(s.reps) : Number(s.kg); if (v && (!best || v > best.v)) best = { v, d, reps: s.reps }; })); return best ? { id, best } : null; }).filter(Boolean);
  if (!recs.length) h += '<p class="vide">Tes records s’afficheront ici dès ta première séance.</p>';
  recs.forEach(r => h += `<div class="rec"><div><b>${EX[r.id].nom}</b><br><span>${new Date(r.best.d + 'T12:00').toLocaleDateString('fr-FR', { day:'numeric', month:'short' })}</span></div><b class="num">${EX[r.id].poidsCorps ? r.best.v + ' rép.' : fmt(r.best.v) + ' kg × ' + r.best.reps}</b></div>`);
  h += `</section></div><div class="row" style="margin-top:16px"><button class="btn btn-ghost" type="button" onclick="exporter()">Sauvegarder</button><button class="btn btn-ghost" type="button" onclick="importer()">Restaurer</button></div>`;
  document.getElementById('app').innerHTML = h;
}
function exporter() { const blob = new Blob([JSON.stringify(D)], { type:'application/json' }), f = new File([blob], 'muscu-' + iso(auj) + '.json', { type:'application/json' }); if (navigator.canShare && navigator.canShare({ files:[f] })) navigator.share({ files:[f] }).catch(() => {}); else { const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = f.name; a.click(); } }
function importer() { const i = document.createElement('input'); i.type = 'file'; i.accept = '.json,application/json'; i.onchange = () => { const r = new FileReader(); r.onload = () => { try { const x = JSON.parse(r.result); if (x && x.semaines) { D = x; save(); render(); } } catch (e) {} }; r.readAsText(i.files[0]); }; i.click(); }

let tT;
function toast(v) { const t = document.getElementById('toast'); t.className = 'toast show ' + (v.ok ? 'ok' : 'ko'); document.getElementById('toastIc').innerHTML = v.ok ? '<path d="M5 12.5l4.5 4.5L19 7.5"/>' : '<path d="M12 4l9 16H3z"/><path d="M12 10v4M12 17.5v.5"/>'; document.getElementById('toastT').textContent = v.t; document.getElementById('toastS').textContent = v.s; clearTimeout(tT); tT = setTimeout(() => t.classList.remove('show'), 4200); }

render();
</script>
</body>
